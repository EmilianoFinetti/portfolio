server {
    listen 80;
    server_name emilianofinetti.com;
    return 301 https://www.emilianofinetti.com$request_uri;
}

server {
    listen 80 default_server;
    server_name www.emilianofinetti.com localhost "";
    
    # Redirect HTTP traffic to HTTPS if behind reverse proxy
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }
    
    root /usr/share/nginx/html;
    index index.html index.htm;
    
    error_page 404 /404.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache immutable Astro bundled assets
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Cache images, fonts, icons and documents
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|webp|avif|woff2?|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        absolute_redirect off; 
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
    }
}